name: Java Project CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Kéo code từ repository về runner
    - name: Checkout code
      uses: actions/checkout@v4

    # Bước 2: Cài đặt môi trường Java (Chọn đúng phiên bản dự án đang dùng, ví dụ 17)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven' 

    # Bước 3: Chạy kiểm tra Convention và Biên dịch thử sản phẩm
    
  
    - name: Build and Validate with Maven
      run: mvn clean verify
